# Local production build – builds from source instead of pulling from Docker Hub.
# Uses production settings (same as docker-compose.yml) but builds locally.
#
# First run (or after Dockerfile changes):
#   docker compose --env-file .env -f docker/docker-compose.local.yml up -d --build
#
# Subsequent runs:
#   docker compose --env-file .env -f docker/docker-compose.local.yml up -d
#
# Environment variables are loaded from:
#   NOTE: run compose with `--env-file .env` from the repo root (the yarn
#   docker:* scripts do this). Compose resolves ${VAR} substitutions below from
#   that file plus your shell — without it, entries like SESSION_SECRET and
#   ENABLE_TEST_ENDPOINTS silently override the env_file with their defaults.
#   - .env file (project root) via env_file directive
#   - Environment variables set in your shell (for docker-compose variable substitution)
#
# Default port: 3069 (use HOST_PORT=27016 to override)

services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-tournament-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-auto_tournament}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auto-tournament-network

  auto-tournament:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Enable developer menus/tools in the client build (see client/src/hooks/useIsDevelopment.ts)
        VITE_ENABLE_DEV_PAGE: "true"
    container_name: auto-tournament
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - '${HOST_PORT:-3069}:3069'
    environment:
      # Container-specific settings (not from .env)
      - NODE_ENV=production
      - PORT=3000
      # Default frontend URL for session cookies and redirects.
      # Override in your shell if needed; this value also ensures E2E tests
      # run against localhost without cookie domain issues.
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:${HOST_PORT:-3069}}
      # Allow enabling /api/test/* helpers for E2E in prod-like stacks.
      # Keep disabled by default for safety.
      - ENABLE_TEST_ENDPOINTS=${ENABLE_TEST_ENDPOINTS:-false}
      # Register the test-only fake game integration (integrations/fake) for
      # E2E runs. Needs ENABLE_TEST_ENDPOINTS too; off by default.
      - MAT_TEST_INTEGRATION=${MAT_TEST_INTEGRATION:-0}
      # Built-in game enrichment (gameEnrichmentService) calls real Wikidata;
      # keep it off for local "prod-like" and E2E stacks by default.
      - GAMES_ENRICH=${GAMES_ENRICH:-off}
      # A local image's CS2 snapshot is signed with a throwaway key
      # (scripts/build-module-snapshot.sh --ephemeral); trust it here. The
      # catalog and the pack preinstall follow the shell too, for E2E runs.
      - MODULE_TRUSTED_KEYS=${MODULE_TRUSTED_KEYS:-}
      - PREINSTALL_PACKS=${PREINSTALL_PACKS:-}
      - CATALOG_OFFLINE=${CATALOG_OFFLINE:-}
      # Allow simulation settings in local "prod-like" builds
      - AT_ENABLE_SIMULATION_IN_PROD=true
      # Docker service name for DB connection (not from .env)
      - DB_HOST=postgres
      # Computed DATABASE_URL (uses DB_* vars from .env or defaults)
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-auto_tournament}
      # SESSION_SECRET should be set in .env (required for session persistence)
      # If not set, a default is used but sessions won't persist across restarts
      - SESSION_SECRET=${SESSION_SECRET:-}
      # All other variables (SERVER_TOKEN, STEAM_API_KEY, FRONTEND_BASE_URL, LOG_LEVEL, etc.)
      # are loaded from .env via env_file directive above
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3069/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - auto-tournament-network

networks:
  auto-tournament-network:
    driver: bridge
