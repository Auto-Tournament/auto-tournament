name: 🐞 Bug report
description: Something in Auto Tournament, CS2 Server Manager or Ready Up is broken
labels: ['🐞 bug']
body:
  - type: markdown
    attributes:
      value: |
        One form for the whole stack: the Auto Tournament site, CS2 Server Manager (`csm`) on your machines, and Ready Up on the CS2 servers.
        Need help setting servers up rather than reporting a bug? Use **Server setup help**.

  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - 'Tournaments: setup, sign-up, brackets, matches or veto'
        - 'Sign-in, accounts or admin access'
        - 'Servers page: machines, servers or failover'
        - 'CS2 Server Manager (csm) on the machine'
        - 'Ready Up on the CS2 server (in game)'
        - 'Demos or highlights'
        - 'API, webhooks or the Discord bot'
        - 'Game packs or another module'
        - 'Not sure'
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Drag screenshots in here.
      placeholder: |
        I started the tournament. The round 1 matches stayed on "Waiting for a server", although two servers show Ready on the Servers page.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a single elimination tournament with 4 teams
        2. Start it
        3. Open Matches
    validations:
      required: true

  - type: input
    id: at-version
    attributes:
      label: Auto Tournament version
      description: Shown under the site name on the admin home page, and at the bottom of Settings.
      placeholder: '3.0.14'
    validations:
      required: true

  - type: input
    id: server-versions
    attributes:
      label: Server versions
      description: |
        If servers are involved. The Servers page shows the csm and Ready Up versions on each machine. `version` in the server console shows the CS2 version.
      placeholder: 'csm 1.27.4, Ready Up 0.2.8, CS2 1.41.8.4'

  - type: dropdown
    id: install
    attributes:
      label: How do you run Auto Tournament?
      options:
        - 'Docker Compose (docker/docker-compose.yml)'
        - 'Docker another way (Portainer, Unraid, Coolify, …)'
        - 'From source (yarn dev)'
        - 'Other'

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The lines around the problem. Where to find them:
        - Auto Tournament: `docker logs --tail 200 auto-tournament`, or Admin Tools → Application Logs
        - csm: `csm logs 1 200` (server 1), and `~/logs/csm.log`
        - Ready Up: `ru selftest` in the server console
        - Browser: F12 → Console
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues
          required: true
        - label: I removed passwords, tokens and API keys from what I pasted
          required: true
