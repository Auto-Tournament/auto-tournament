name: 📖 Documentation
description: Something on docs.autotournament.gg is missing, wrong or unclear
labels: ['📖 documentation']
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - 'Missing'
        - 'Wrong or out of date'
        - 'Unclear'
        - 'Broken link'
        - 'A command or example does not work'
        - 'Typo'
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page.
      placeholder: 'https://docs.autotournament.gg/getting-started/connect-server'
    validations:
      required: true

  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      placeholder: |
        Step 3 says …, but on my site …
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: What it should say
      description: Optional, if you know.
