name: 🌍 Translation
description: Add a language, fill gaps, or fix wording in a translation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping translate Auto Tournament. The steps are in [TRANSLATING.md](https://github.com/Auto-Tournament/auto-tournament/blob/main/TRANSLATING.md), the longer version in the [docs](https://docs.autotournament.gg/developer/translating).

        The strings live in two places:
        - [`client/src/locales/<lang>/translation/`](https://github.com/Auto-Tournament/auto-tournament/tree/main/client/src/locales): the site
        - `client/src/integrations/<module>/locales/<lang>.json`: modules, such as [CS2](https://github.com/Auto-Tournament/auto-tournament/tree/main/client/src/integrations/cs2/locales) (servers, veto, rules)

  - type: dropdown
    id: kind
    attributes:
      label: What are you doing?
      options:
        - 'Adding a new language'
        - 'Filling missing strings'
        - 'Better wording'
        - 'Fixing mistakes'
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language and code
      placeholder: 'German (de), Brazilian Portuguese (pt-BR)'
    validations:
      required: true

  - type: dropdown
    id: speaker
    attributes:
      label: How well do you speak it?
      options:
        - 'Native speaker'
        - 'Fluent'
        - 'I used a translation tool and checked the result'
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What you changed or want to change
      description: Pages, areas or specific strings.
      placeholder: |
        The Servers page and the veto were still half in English.
    validations:
      required: true

  - type: textarea
    id: terms
    attributes:
      label: Terms you are unsure about
      description: Optional. Esports words such as bracket, veto, Bo3 or seed often stay in English. That's fine.

  - type: input
    id: pr
    attributes:
      label: Pull request
      description: Optional, if you already opened one.
      placeholder: 'https://github.com/Auto-Tournament/auto-tournament/pull/…'

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you send it
      options:
        - label: I kept the keys and the `{{placeholders}}` exactly as in English
          required: true
        - label: I tried it in the running app (`yarn dev`, then pick the language in the top bar)
