name: ⚡ Performance problem
description: Slow pages, lag on a server, or high CPU or memory use
labels: ['🐞 bug']
body:
  - type: dropdown
    id: where
    attributes:
      label: Where is it slow?
      options:
        - 'A page on the site'
        - 'Live updates (scores, veto, match status) arrive late'
        - 'The Auto Tournament container (CPU, memory, database)'
        - 'A CS2 server (lag, low tick rate, stutter)'
        - 'The machine running csm'
        - 'Something else'
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What is slow
      description: What you did, how long it took, and how long you expected.
      placeholder: |
        The bracket page of a 64-team double elimination takes 12 seconds to load. Smaller tournaments load in 1 second.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a tournament with 64 teams
        2. Click Bracket
    validations:
      required: true

  - type: dropdown
    id: scale
    attributes:
      label: How big is the site?
      options:
        - 'Small (under 10 teams, under 20 matches)'
        - 'Medium (10 to 50 teams, 20 to 100 matches)'
        - 'Large (50 to 100 teams, 100 to 500 matches)'
        - 'Very large (over 100 teams or 500 matches)'
        - 'Not sure'

  - type: textarea
    id: environment
    attributes:
      label: Setup
      placeholder: |
        - Auto Tournament 3.0.14 in Docker Compose
        - 4 cores, 8 GB RAM
        - 2 machines with csm, 6 servers
    validations:
      required: true

  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: |
        Optional. What you measured, for example:
        - Browser: F12 → Network, the slow requests and their times
        - Container: `docker stats`
        - CS2 server: `ru perf` in the server console, or `stats`
      render: text

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Optional. When it started, workarounds, whether it happens in one browser only.
