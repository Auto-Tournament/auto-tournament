name: ❓ Question
description: Ask how something works, or how to set it up
body:
  - type: markdown
    attributes:
      value: |
        Quick questions get answered faster on [Discord](https://discord.gg/n7gHYau7aW). Check the [docs](https://docs.autotournament.gg) first.

  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options:
        - 'Installing or updating Auto Tournament'
        - 'Tournaments, formats and the veto'
        - 'Players, teams and sign-in'
        - 'Servers, CS2 Server Manager (csm) and Ready Up'
        - 'Demos and highlights'
        - 'API, webhooks and modules'
        - 'Licensing'
        - 'Something else'

  - type: textarea
    id: question
    attributes:
      label: Your question
      placeholder: |
        Can a Bo1 veto use a different ban order than the Bo3 veto?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What you are trying to do
      placeholder: |
        I run a cup with Bo1 groups and Bo3 playoffs, and I want each team to ban 3 maps in the Bo1 games.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Optional. Auto Tournament, csm and Ready Up, if they matter.
      placeholder: 'Auto Tournament 3.0.14, csm 1.27.4, Ready Up 0.2.8'

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you send it
      options:
        - label: I searched the docs and the existing issues
          required: true
