name: 🙏 Community request
description: Ask the community to help test something, or to give feedback
labels: ['🆘 need help']
body:
  - type: markdown
    attributes:
      value: |
        For tests one person can't do alone, such as a full 5v5 on Ready Up, many sign-ups at once, or a different OS. People who help get credited.

  - type: textarea
    id: what
    attributes:
      label: What needs testing
      placeholder: |
        The knife round and side pick on Ready Up 0.2.8, on a server linked with csm.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why you need help
      placeholder: |
        It needs 10 players on two teams.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to test it
      description: Steps a tester can follow without asking you.
      placeholder: |
        1. Join the server from the match page at https://cs.example.com/…
        2. Ready up with `.r`
        3. Play the knife round and pick a side
        4. Report what happens in the issue
    validations:
      required: true

  - type: textarea
    id: needs
    attributes:
      label: What testers need
      placeholder: |
        - CS2 and a Steam account
        - About 30 minutes on Saturday 20:00 CET
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: What to report back
      placeholder: |
        - Did the side pick menu show for the winning captain?
        - Did the match go live on the picked sides?

  - type: input
    id: link
    attributes:
      label: Pull request or branch
      description: Optional.
      placeholder: 'https://github.com/Auto-Tournament/auto-tournament/pull/…'

  - type: input
    id: deadline
    attributes:
      label: Deadline
      description: Optional.
