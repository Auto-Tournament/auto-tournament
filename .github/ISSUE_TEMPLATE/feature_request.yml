name: ➕ Feature request
description: Suggest something Auto Tournament, CS2 Server Manager or Ready Up should do
labels: ['➕ new feature']
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - 'Tournaments, matches and the veto'
        - 'Players, teams and sign-in'
        - 'Servers page and CS2 Server Manager (csm)'
        - 'Ready Up (in game)'
        - 'Demos and highlights'
        - 'API, webhooks and modules'
        - 'Something else'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: The situation, and what is missing today.
      placeholder: |
        I run a weekly cup for my community. Each week I … by hand, and it takes about an hour.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How it could work
      placeholder: |
        When …, the site could …
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Optional. A workaround, another tool, or nothing.

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Optional. Links, mockups or screenshots.

  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test it when it's ready
        - label: I'd like to write the code (ask in the issue first, see the contributing guide)
