name: 🖥️ CS2 Server Setup Help
description: Get help setting up or troubleshooting CS2 servers with csm and Ready Up
title: "[SERVER HELP] "
labels: ["question", "server-setup", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        Need help with CS2 server setup? We'll help you get configured!

        **Quick Resources:**
        - [Install csm](https://docs.autotournament.gg/cs2/server-manager/install)
        - [Ready Up](https://docs.autotournament.gg/cs2/ready-up)
        - [Ready Up FAQ](https://docs.autotournament.gg/cs2/ready-up/faq)

        We can only help with servers that csm set up. A server built by hand can differ in too many ways (cvars, configs, ports, versions) to reproduce.

  - type: dropdown
    id: server-issue-type
    attributes:
      label: What do you need help with?
      description: Select the primary issue you're facing
      options:
        - "Installing csm (never done this before)"
        - "Machine won't link to the platform"
        - "Create server fails or hangs"
        - "Ready Up not loading"
        - "Match won't load on server"
        - "Server shows offline in platform"
        - "Performance issues (lag, crashes)"
        - "Config/ConVar questions"
        - "Other (specify below)"
    validations:
      required: true

  - type: textarea
    id: problem-description
    attributes:
      label: 🎯 Describe Your Issue
      description: What's not working or what do you need help with?
      placeholder: |
        Example: "I linked the machine with csm link and created two servers. Both show Online, but when a match starts it stays on 'Waiting for server' and the players never get a connect address."
    validations:
      required: true

  - type: textarea
    id: what-tried
    attributes:
      label: 🔧 What Have You Tried?
      description: What steps have you already taken?
      placeholder: |
        Example:
        - Ran csm doctor (output below)
        - Ran sudo csm self-update and csm update-plugins
        - Restarted the server with csm restart 1
        - Checked that players can connect to the server
    validations:
      required: true

  - type: dropdown
    id: server-hosting
    attributes:
      label: Server Hosting
      description: Where is your CS2 server hosted?
      options:
        - "Self-hosted (own hardware)"
        - "VPS/Cloud (AWS, DigitalOcean, etc.)"
        - "Dedicated server provider"
        - "Virtual machine on my own hardware"
        - "Other (specify below)"
    validations:
      required: true

  - type: input
    id: server-os
    attributes:
      label: Server Operating System
      description: What OS is your CS2 server running?
      placeholder: "e.g., Ubuntu 24.04, Debian 12"
    validations:
      required: true

  - type: input
    id: csm-version
    attributes:
      label: csm version
      description: Shown on the machine under Servers in Auto Tournament.
      placeholder: "e.g., csm 1.27.4"
    validations:
      required: true

  - type: input
    id: readyup-version
    attributes:
      label: Ready Up version
      description: Type `ru version` in the CS2 server console.
      placeholder: "e.g., Ready Up 0.2.8"
    validations:
      required: false

  - type: input
    id: platform-version
    attributes:
      label: Auto Tournament version
      description: Shown at the bottom of the admin page, or under Manage → System
      placeholder: "e.g., 3.0.8"
    validations:
      required: false

  - type: textarea
    id: server-logs
    attributes:
      label: 📋 Server Log
      description: |
        **Required** - Paste the server log from map load until the problem, and the output of `csm doctor`:
        - `csm logs <server> 400` (e.g. `csm logs 1 400`)
        - `csm doctor`
      placeholder: |
        Example:
        ```
        [ReadyUp] state: mode=match_warmup warmup=1 ct=1+0 t=1+0 spec=0 ready=0/2
        [ReadyUp] selftest: Ready Up 0.2.8 on CS2 Patchversion 1.41.9.0
        ```
      render: shell
    validations:
      required: true

  - type: textarea
    id: platform-config
    attributes:
      label: ⚙️ What the Platform Shows
      description: What does the Servers page show for this machine and server?
      placeholder: |
        From Servers → Machines:
        - Machine: "CS" (Online, csm 1.27.4)
        - Server: "server-1" (Online, Ready Up 0.2.8)
        - Any error on the tile: "csm stopped reporting progress at ..."
    validations:
      required: true

  - type: textarea
    id: network-info
    attributes:
      label: 🌐 Network Information
      description: Network setup between the platform, the machine and the players
      placeholder: |
        - Platform hosted: Same machine / Different machine / Other network
        - The machine connects out to the platform over a websocket; can it reach the platform URL? (curl test)
        - Game ports open for players: 27015 and up (UDP/TCP)
        - Using private network / public IP / NAT
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I've checked the server setup documentation
          required: true
        - label: I've included the server log
          required: true
        - label: I've verified the CS2 server is running and players can connect
          required: false
