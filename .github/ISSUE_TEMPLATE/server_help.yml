name: 🖥️ Server setup help
description: Help with CS2 Server Manager, Ready Up, or getting servers onto your site
labels: ['🆘 need help']
body:
  - type: markdown
    attributes:
      value: |
        Most server problems are answered in these pages:
        - [Game servers with csm](https://docs.autotournament.gg/getting-started/connect-server): linking a machine
        - [Server health warnings](https://docs.autotournament.gg/reference/servers-health): Offline, Waiting to enroll, Revoked, CS2 update required
        - [CS2 Server Manager troubleshooting](https://docs.autotournament.gg/cs2/server-manager/troubleshooting): start with `csm doctor`
        - [Ready Up troubleshooting](https://docs.autotournament.gg/cs2/ready-up/troubleshooting): start with `ru selftest`

  - type: dropdown
    id: topic
    attributes:
      label: What do you need help with?
      options:
        - 'Installing csm, or linking a machine (Servers → Add machine)'
        - 'A server shows Offline, Waiting to enroll or Revoked'
        - 'A server does not start'
        - 'Ready Up does not load, or `ru selftest` fails'
        - 'A match does not load on the server'
        - 'CS2 updates'
        - 'Demos or highlights'
        - 'Servers I set up without csm'
        - 'Something else'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What you see, and where. The Servers page, the server console, or in game.
      placeholder: |
        I linked the machine and it shows on the Servers page, but its two servers stay on Offline.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you tried
      placeholder: |
        - Ran `csm doctor`, it found nothing
        - Restarted with `csm restart`
        - `curl -I https://cs.example.com` works from the machine
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where do the servers run?
      options:
        - 'On the same machine as Auto Tournament'
        - 'On another machine on my network'
        - 'On a VPS or rented dedicated server'
        - 'At a game server host'
        - 'Other'
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Machine OS
      description: '`cat /etc/os-release` on the machine with the servers.'
      placeholder: 'Ubuntu 24.04, Debian 13, …'
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: |
        Auto Tournament (admin home page), and the csm and Ready Up versions (on the machine on the Servers page). `version` in the server console shows the CS2 version.
      placeholder: 'Auto Tournament 3.0.14, csm 1.27.4, Ready Up 0.2.8, CS2 1.41.8.4'
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: csm doctor output
      description: '`csm doctor` on the machine.'
      render: text

  - type: textarea
    id: selftest
    attributes:
      label: ru selftest output
      description: '`ru selftest` in the server console. Open it with `csm attach 1`, leave with Ctrl+B, then D.'
      render: text

  - type: textarea
    id: log
    attributes:
      label: Server log
      description: '`csm logs 1 200` for server 1. The lines around the problem.'
      render: text
    validations:
      required: true

  - type: textarea
    id: network
    attributes:
      label: Network
      description: Optional. Anything between the machine and your site, such as a reverse proxy, a VPN, a firewall or Cloudflare.
      placeholder: |
        Auto Tournament runs behind nginx at https://cs.example.com. The machine is on the same LAN.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you send it
      options:
        - label: I read the troubleshooting pages linked above
          required: true
        - label: I removed passwords, tokens and enrollment codes from what I pasted
          required: true
