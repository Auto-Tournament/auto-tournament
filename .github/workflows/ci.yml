name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tag given to the image the build job produces and every shard loads.
  # docker/docker-compose.ci.yml points the app service at it.
  MAT_IMAGE: auto-tournament:ci
  # Public repo: runners are free, so more shards only cost setup time (~40s
  # each after the image arrives). 16 is the ceiling: the org's Free plan runs
  # 20 jobs at once, and build, lint and change detection run alongside the
  # shards. A pull request uses as many as its affected specs need (~40s each).
  SHARD_MAX: 16

jobs:
  # The demo worker (worker/): a Go module of its own, outside the yarn
  # workspaces. Vet and unit-test it on every change.
  worker:
    name: Demo worker (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=windows go build -o /dev/null .

  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Formatted (the files this change touches)
        if: github.event_name == 'pull_request'
        run: FORMAT_BASE=origin/${{ github.base_ref }} yarn format:check

      - name: Lint
        run: yarn lint

      # 3.0 has one tournament row; the id is passed as a parameter so 3.1
      # only changes where it comes from (api/src/utils/tournamentRow.ts).
      # Fails on new hard-coded `id = 1` / `tournament_id = 1` style literals.
      - name: No hard-coded tournament ids
        run: yarn check:tournament-literals

      # The build strips types without checking them (esbuild for the api, Vite
      # for the client), so tsc errors have never failed anything. This ratchets
      # the count instead of gating on zero: the build fails only when new type
      # errors are introduced. See scripts/typecheck-ratchet.mjs.
      - name: Typecheck (ratchet)
        run: yarn typecheck:ratchet

      # Every locale must have every key en has (otherwise the UI silently falls
      # back to English), and no locale file may contain duplicate JSON keys.
      - name: i18n keys complete
        working-directory: client
        run: |
          node scripts/check-missing-i18n-keys.mjs
          node scripts/check-duplicate-json-keys.mjs

      # docs/API-REFERENCE.md and docs/openapi.json are generated from the
      # routers. This fails when a route is added, removed or has its auth
      # changed without regenerating — the only thing keeping them honest, and
      # openapi.json is what people outside this repo generate clients from.
      - name: API docs are current
        run: yarn docs:api:check

      # Everything the server and the web app ship must be under a license
      # that allows it inside a PolyForm Noncommercial product (no GPL/AGPL
      # copyleft, no unknown license): scripts/third-party-notices.mjs.
      - name: Third-party licenses are allowed
        run: node scripts/third-party-notices.mjs --check

      # examples/discord-bot is a standalone project, not a workspace, so it
      # installs on its own. Typechecking it here is what stops the example
      # rotting against the API it demonstrates — which is the whole reason it
      # lives in this repo rather than one of its own.
      - name: Typecheck the Discord bot example
        working-directory: examples/discord-bot
        run: |
          yarn install --immutable
          yarn typecheck

  # Decides which E2E specs a change can affect (tests/ci-affected.mjs), like
  # a monorepo tool running only affected tasks: specs whose imports or API
  # routes reach a changed file, every UI spec for a client change, the whole
  # suite for shared files or anything the graph can't place. Docs-only pull
  # requests run none; the `E2E tests` job still reports green. Pushes to main
  # always run the whole suite, so a miss is caught on merge.
  changes:
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.pick.outputs.e2e }}
      specs: ${{ steps.pick.outputs.specs }}
      shards: ${{ steps.pick.outputs.shards }}
      total: ${{ steps.pick.outputs.total }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          specs=""
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request: running the whole suite."
            run=true
          elif ! files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename')" || [ -z "$files" ]; then
            # Listing failed (API hiccup, oversized diff): run everything rather than skip.
            echo "Could not list changed files: running the whole suite."
            run=true
          else
            # shellcheck disable=SC2086
            result="$(node tests/ci-affected.mjs $files)"
            echo "$result" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(r.reason);for(const s of r.specs)console.log("  "+s)'
            all="$(echo "$result" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).all)')"
            specs="$(echo "$result" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0,"utf8")).specs.join(" "))')"
            if [ "$all" = "true" ]; then run=true; specs=""
            elif [ -n "$specs" ]; then run=true
            else run=false; fi
          fi
          total=1
          if [ "$run" = true ]; then total="$(CI_SPECS="$specs" node tests/ci-shard.mjs --count "$SHARD_MAX")"; fi
          shards="$(node -e "console.log(JSON.stringify(Array.from({length:$total},(_, i)=>i+1)))")"
          echo "e2e=$run shards=$total"
          {
            echo "e2e=$run"
            echo "specs=$specs"
            echo "shards=$shards"
            echo "total=$total"
          } >> "$GITHUB_OUTPUT"

  # Builds the app image once and hands it to the shards as a tarball. The app
  # is compiled here, with node_modules from the Actions cache, and the image
  # only packs the output (docker/Dockerfile, APP_BUILD=prebuilt): no yarn
  # install inside Docker, which took 6+ minutes whenever yarn.lock changed.
  build:
    name: Build E2E image
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # ~2 min cached, ~6.5 min on a cache miss.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `cache: yarn`: node_modules itself is cached below.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            api/node_modules
            client/node_modules
          key: nm-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      # CS2 is a catalog module (DESIGN-modules §10): the image carries it only
      # in its offline snapshot, as a signed release. CI signs it with a
      # throwaway key made for this run; the shards trust that key's public
      # half (MODULE_TRUSTED_KEYS). The release signs with the real key.
      #
      # The app: what the Dockerfile's build stage makes, laid out as its /app.
      # The snapshot, server and client builds are independent: run together.
      - name: Build the module snapshot and the app
        env:
          VITE_ENABLE_DEV_PAGE: 'true'
        run: |
          bash scripts/build-module-snapshot.sh --ephemeral > "$RUNNER_TEMP/snapshot.log" 2>&1 & snapshot=$!
          yarn build:server > "$RUNNER_TEMP/server.log" 2>&1 & server=$!
          yarn build:client > "$RUNNER_TEMP/client.log" 2>&1 & client=$!
          status=0
          for job in "snapshot:$snapshot" "server:$server" "client:$client"; do
            if ! wait "${job#*:}"; then echo "::error::${job%%:*} build failed"; status=1; fi
            echo "::group::${job%%:*} log"; cat "$RUNNER_TEMP/${job%%:*}.log"; echo "::endgroup::"
          done
          [ "$status" -eq 0 ]
          sed -n 's/^MODULE_TRUSTED_KEYS=//p' "$RUNNER_TEMP/snapshot.log" > "$RUNNER_TEMP/trusted-key.txt"
          test -s "$RUNNER_TEMP/trusted-key.txt"
          ls -la api/bundled-modules
          out=ci-prebuilt
          mkdir -p "$out/api" "$out/docs"
          cp package.json "$out/"
          cp -r api/dist api/public api/swagger-ui api/bundled-packs api/bundled-modules "$out/api/"
          cp docs/openapi.json "$out/docs/"
          # The third-party notices the image ships, from these dependencies.
          node scripts/third-party-notices.mjs
          cp THIRD_PARTY_NOTICES.md "$out/"

      - uses: docker/setup-buildx-action@v3

      # The release stage of docker/Dockerfile around the files built above.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            APP_BUILD=prebuilt
          tags: ${{ env.MAT_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/mat-image.tar
          cache-from: type=gha,scope=e2e-image
          cache-to: type=gha,scope=e2e-image,mode=max

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: e2e-image
          path: |
            ${{ runner.temp }}/mat-image.tar
            ${{ runner.temp }}/trusted-key.txt
          # Image layers are already gzip-compressed.
          compression-level: 0
          retention-days: 1

  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ needs.changes.outputs.total }}
    # Not `needs: build`: shards start alongside the image build and do their
    # own setup (deps, browser, Postgres) meanwhile, then wait for the image
    # artifact. Takes the setup time off the wall clock.
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Includes waiting for the image build; the tests themselves get 5 min below.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      # Let every shard finish so the merged report shows every failure.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    # Each shard is its own runner with its own app + Postgres stack, so specs
    # that reset the database cannot collide across shards. Within a shard the
    # suite still runs with workers: 1 (tests/playwright.config.ts).
    env:
      COMPOSE: docker compose --env-file .env -f docker/docker-compose.local.yml -f docker/docker-compose.ci.yml
      SHARD_TOTAL: ${{ needs.changes.outputs.total }}
      # The affected specs (empty: all of them). tests/ci-shard.mjs reads it.
      CI_SPECS: ${{ needs.changes.outputs.specs }}
    steps:
      - uses: actions/checkout@v4

      # The compose stack reads the repo-root .env, both for env_file and for
      # ${VAR} substitution (hence --env-file). Building it from example.env
      # also means CI exercises the documented setup path.
      #
      # No STEAM_API_KEY: Steam is left unconfigured on purpose, so the suite has
      # to hold up with no auth provider enabled.
      - name: Create .env
        run: |
          cp example.env .env
          {
            echo "SESSION_SECRET=ci-session-secret"
            echo "SERVER_TOKEN=server123"
            echo "ENABLE_TEST_ENDPOINTS=true"
            echo "MAT_TEST_INTEGRATION=1"
            # The license terms are accepted up front, so the admin UI opens
            # (tests/ui/license-consent.spec.ts covers the consent step).
            echo "AT_ACCEPT_LICENSE=noncommercial"
            echo "AT_VETO_TURN_SECONDS_DEFAULT=0"
            echo "GAMES_ENRICH=off"
            # The suite saves test license keys: never check in with
            # autotournament.gg from CI (services/license/checkin.ts).
            echo "LICENSE_CHECKIN_URL=off"
            # A stock install has no games; the suite needs the image's packs.
            echo "PREINSTALL_PACKS=all"
            # The suite never depends on GitHub: the catalog offers what the
            # image carries (specs point it at their own fake feed).
            echo "CATALOG_OFFLINE=true"
            # Nothing restarts the CI container: "Restart now" answers 409.
            echo "AT_RESTART_SUPERVISED=false"
            echo "API_TOKENS=ci-admin:ci-admin-token-0123456789abcdef"
            echo "API_TOKENS_READONLY=ci-readonly:ci-readonly-token-0123456789abcdef"
            # The teams API for integrators (tests/api/integration-teams.spec.ts).
            echo "API_TOKENS_INTEGRATOR=ci-ntlan:ci-integrator-token-0123456789abcdef,ci-other:ci-integrator2-token-0123456789abcdef"
            # Ready Up compatibility (tests/api/compat.spec.ts, tests/ui/compat-page.spec.ts).
            echo "COMPAT_INGEST_TOKEN=ci-compat-token-0123456789abcdef"
            # No autoscaler timer: it would send csm commands to other specs'
            # fake machines. tests/api/fleet-autoscale.spec.ts runs passes itself.
            echo "FLEET_AUTOSCALE_INTERVAL_MS=0"
            echo "STEAM_API_KEY="
            echo "LOG_LEVEL=info"
          } >> .env

      # Postgres needs nothing from the image build, so pull it and let it get
      # healthy while the rest of the setup runs.
      - name: Start Postgres
        run: $COMPOSE up -d postgres

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # node_modules (root + workspaces) keyed on the lockfile only: every
      # release bumps "version" in the package.json files, which changes no
      # dependency. On a hit the install is skipped entirely.
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            api/node_modules
            client/node_modules
          key: nm-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # apt sometimes stalls: on 2026-10-07 the runners' Azure Ubuntu mirror
      # stopped answering and the step took a shard's whole 15 minutes. Use
      # the main archive with short timeouts, and three tries of three
      # minutes; a try that stalls leaves apt-get holding its lock, so it is
      # killed before the next.
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: |
          sudo sed -i 's#http://azure.archive.ubuntu.com#https://archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          # The runner images list their mirrors here (mirror+file:), the Azure one first.
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          for i in 1 2 3; do
            timeout 180 npx playwright install-deps chromium && exit 0
            echo "::warning::playwright install-deps attempt $i stalled or failed; retrying"
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sleep 2
            sudo dpkg --configure -a || true
          done
          exit 1

      # Poll until the build job has uploaded the image, or give up as soon as
      # that job ends without success.
      - name: Wait for the image build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          for i in $(seq 1 240); do
            count="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts?name=e2e-image" --jq '.total_count' || echo 0)"
            if [ "${count:-0}" -gt 0 ]; then
              echo "Image artifact available (poll ${i})."
              exit 0
            fi
            conclusion="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
              --jq '.jobs[] | select(.name == "Build E2E image") | .conclusion' || true)"
            if [ -n "$conclusion" ] && [ "$conclusion" != "null" ] && [ "$conclusion" != "success" ]; then
              echo "Build E2E image finished with '${conclusion}'." >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for the image artifact." >&2
          exit 1

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${{ runner.temp }}/mat-image.tar"

      # The image's CS2 was signed with this run's throwaway key (see the
      # build job); the app trusts it for this run only.
      - name: Trust this run's module signing key
        run: echo "MODULE_TRUSTED_KEYS=$(cat "${{ runner.temp }}/trusted-key.txt")" >> .env

      - name: Start the stack
        run: $COMPOSE up -d --no-build

      - name: Wait for the app
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3069/health > /dev/null; then
              echo "app healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "App never became healthy." >&2
          $COMPOSE logs --tail=100
          exit 1

      # CS2 is not compiled into the image. Install it the way an admin does:
      # from the catalog's offline snapshot — signature verified, unpacked,
      # migrated and loaded without a restart — so the CS2 specs run against
      # the real module path, not a compiled-in shortcut.
      - name: Install CS2 through the catalog
        run: |
          response="$(curl -s -X POST http://localhost:3069/api/catalog/modules/cs2/install \
            -H 'Authorization: Bearer ci-admin-token-0123456789abcdef' \
            -H 'Content-Type: application/json' -d '{}')"
          echo "$response"
          echo "$response" | grep -q '"success":true' || { $COMPOSE logs --tail=100; exit 1; }

      # Whole spec files, packed by measured duration (tests/ci-shard.mjs) rather
      # than Playwright's --shard, which splits by test count and left the
      # UI-heavy last shard ~3x slower than the first. Files are never split, so
      # serial describes and in-file state stay on one shard.
      - name: Run Playwright
        timeout-minutes: 5
        env:
          SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3069
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
          SHARD: ${{ matrix.shard }}
        run: |
          files="$(node tests/ci-shard.mjs "$SHARD" "$SHARD_TOTAL")"
          echo "Shard $SHARD/$SHARD_TOTAL runs: $files"
          # shellcheck disable=SC2086
          npx playwright test -c tests/playwright.config.ts --reporter=list,blob $files

      # Container logs are usually more informative than the Playwright trace
      # when the failure is server-side.
      - name: Dump container logs
        if: failure()
        run: $COMPOSE logs --tail=300

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  report:
    name: Merge Playwright reports
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            api/node_modules
            client/node_modules
          key: nm-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Aggregate status under the check name branch protection has always required.
  # Green when every shard passed, or when the change filter skipped E2E.
  e2e-result:
    name: E2E tests
    needs: [changes, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check E2E outcome
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_E2E: ${{ needs.changes.outputs.e2e }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.e2e.result }}
        run: |
          echo "changes=$CHANGES run_e2e=$RUN_E2E build=$BUILD shards=$SHARDS"
          if [ "$CHANGES" != "success" ]; then
            echo "Change detection did not succeed." >&2
            exit 1
          fi
          if [ "$RUN_E2E" != "true" ]; then
            echo "No E2E-relevant changes; E2E skipped."
            exit 0
          fi
          if [ "$BUILD" = "success" ] && [ "$SHARDS" = "success" ]; then
            echo "All E2E shards passed."
            exit 0
          fi
          echo "E2E did not pass." >&2
          exit 1
