# The demo worker's image (worker/Dockerfile), for amd64 and arm64.
# Pushed as :next on every change to worker/ on main, and on demand.
name: Worker image

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            sivertio/auto-tournament-worker:next
            sivertio/auto-tournament-worker:sha-${{ github.sha }}
            ghcr.io/auto-tournament/auto-tournament-worker:next
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
